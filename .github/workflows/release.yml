name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: build-sign-macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install mlx-c
        run: brew install mlx-c

      - name: Build artifacts
        run: deno run -A scripts/release_macos.ts

      - name: Import signing certificate
        if: ${{ secrets.MACOS_P12_BASE64 != '' }}
        env:
          MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$MACOS_P12_BASE64" | base64 --decode > "$CERT_PATH"
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          deno run -A scripts/sign_macos.ts \
            dist/deno-mlx-cli/bin/deno-mlx \
            dist/deno-mlx-cli/lib/libmlxc.dylib \
            dist/deno-mlx-cli/lib/libmlx.dylib \
            dist/DenoMLX.app
          cd dist && ditto -c -k --sequesterRsrc --keepParent deno-mlx-cli deno-mlx-cli-aarch64.zip

      - name: Notarize
        if: ${{ secrets.APPLE_API_KEY_BASE64 != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          KEY=$RUNNER_TEMP/AuthKey.p8
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY"
          export APPLE_API_KEY_PATH=$KEY
          deno run -A scripts/notarize_macos.ts dist/deno-mlx-cli-aarch64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deno-mlx-macos-arm64
          path: |
            dist/deno-mlx-cli-aarch64.zip
            dist/SHA256SUMS
            dist/build-metadata.json
            dist/DenoMLX.app

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deno-mlx-cli-aarch64.zip
            dist/SHA256SUMS
            dist/build-metadata.json
          generate_release_notes: true
        # NOTE: intentionally no `deno publish` step — packages stay unpublished.
